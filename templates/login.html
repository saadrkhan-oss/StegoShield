<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StegoShield | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #080c14 100%);
        }
        .auth-card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="text-center mb-4">
            <i class="fa-solid fa-shield-halved text-cyan fs-1 mb-3" style="text-shadow: var(--glow-cyan);"></i>
            <h3 class="fw-bold">StegoShield Access</h3>
            <p class="text-muted small">Enter your credentials to continue</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} bg-{{ category }} text-white border-0 py-2">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="mb-3">
                <label for="username" class="form-label text-light small uppercase fw-bold" style="letter-spacing: 1px;">
                    <i class="fa-solid fa-envelope text-cyan me-1"></i> Operator Email
                </label>
                <input type="email" id="username" name="username" class="form-control bg-dark border-secondary text-light p-2" placeholder="operator@domain.com" required>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label text-light small uppercase fw-bold" style="letter-spacing: 1px;">
                    <i class="fa-solid fa-shield-keyhole text-cyan me-1"></i> Security Password
                </label>
                <input type="password" id="password" name="password" class="form-control bg-dark border-secondary text-light p-2" placeholder="Enter your secret key" required>
            </div>
            <button type="submit" class="btn btn-primary-glow w-100 py-2 fw-bold">
                <i class="fa-solid fa-unlock-keyhole me-2"></i> Authenticate Access
            </button>
        </form>
        <div class="text-center mt-3">
            <small class="text-muted">No clearance? <a href="{{ url_for('auth.register') }}" class="text-cyan">Request Access</a></small>
        </div>
    </div>
</body>
</html>
