# Render.com Blueprint - Auto-deploy configuration
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: stegoshield
    runtime: python
    plan: free
    pythonVersion: "3.11.11"
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_KEY
        value: STEGO_ADMIN_2024
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:///stego.db
      - key: PYTHON_VERSION
        value: 3.11.11
